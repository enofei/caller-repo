name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    uses: enofei/reusable-build-test/.github/workflows/build-test.yml@84333a75913b870266360fe802b5c7a56ca79564  # v1.0.0
    with:
      node-version: '24'
      test-command: 'npm run test:ci'
      security-checks: true

  sast:
    name: SAST
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: enofei/reusable-build-test/.github/workflows/sast.yml@50de289af52635a09aa9b459ff081ccf49d2058b  # provisional: dev pre-tag, repin after v1.0.0 re-cut
    with:
      languages: 'php,javascript'
