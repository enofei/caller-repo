name: Gate Test

# Mode-testing vehicle for the policy gate (dev branch is for testing).
# Runs the same SAST + gate pipeline as ci.yml but with check names that can
# never satisfy main's required status checks, so a test run cannot race or
# substitute for a real PR gate. workflow_dispatch picks the mode; pushes to
# dev run a warn-mode smoke so scanner/gate breakage surfaces immediately.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Gate mode to exercise'
        required: true
        type: choice
        options:
          - warn
          - enforce-critical
          - enforce-full
        default: warn
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  sast-test:
    name: SAST Test
    permissions:
      contents: read
      security-events: write
    uses: enofei/reusable-build-test/.github/workflows/sast.yml@57caa3009d1945b109342dc39bc2c7884d779894  # v1.0.0
    with:
      semgrep-config: 'policy/semgrep-rules'

  gate-test:
    name: Gate Test
    if: ${{ always() }}
    needs: [sast-test]
    permissions:
      contents: read
      actions: read
    uses: enofei/reusable-build-test/.github/workflows/policy.yml@57caa3009d1945b109342dc39bc2c7884d779894  # v1.0.0
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'warn' }}
      policy-path: 'policy/'
