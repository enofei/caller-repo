name: Gate Test

# Advisory warn-only smoke for the policy gate (dev never runs enforce modes).
# Check names can never satisfy main's required status checks.
on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  sast-test:
    name: SAST Test
    permissions:
      contents: read
      security-events: write
    uses: enofei/reusable-build-test/.github/workflows/sast.yml@fee2b6b36444d90fe66821b6c362eb400dfe29e8  # v1.0.0
    with:
      semgrep-config: 'policy/semgrep-rules'

  gate-test:
    name: Gate Test
    if: ${{ always() }}
    needs: [sast-test]
    permissions:
      contents: read
      actions: read
    uses: enofei/reusable-build-test/.github/workflows/policy.yml@fee2b6b36444d90fe66821b6c362eb400dfe29e8  # v1.0.0
    with:
      mode: 'warn'
      policy-path: 'policy/'
